name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Chrome build ──
      - run: npm run build

      - name: Create Chrome archive
        run: |
          cd dist
          zip -r ../chatgpt-word-copier-v${{ steps.version.outputs.version }}.zip . -x '.*'

      # ── Auth to Google ──
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/chromewebstore'

      # ── Upload Chrome package ──
      - name: Upload to Chrome Web Store
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/zip" \
            --data-binary @chatgpt-word-copier-v${{ steps.version.outputs.version }}.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:upload"

      # ── Publish Chrome extension ──
      - name: Publish in Chrome Web Store
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "https://chromewebstore.googleapis.com/v2/publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:publish"

      # ── Optional: check status ──
      - name: Check Chrome Web Store status
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            "https://chromewebstore.googleapis.com/v2/publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:fetchStatus"

      # ── Firefox build ──
      - run: npm run build:firefox

      - name: Create Firefox archive
        run: |
          cd dist-firefox
          zip -r ../chatgpt-word-copier-firefox-v${{ steps.version.outputs.version }}.zip . -x '.*'

      # ── Publish Firefox to AMO ──
      - name: Sign and submit to AMO
        run: |
          npx web-ext sign \
            --source-dir=dist-firefox \
            --channel=listed \
            --approval-timeout=0
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}

      # ── GitHub Release ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            chatgpt-word-copier-v${{ steps.version.outputs.version }}.zip
            chatgpt-word-copier-firefox-v${{ steps.version.outputs.version }}.zip
