name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  github-release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Chrome build ──
      - run: npm run build

      - name: Create Chrome archive
        run: |
          cd dist
          zip -r ../chatgpt-word-copier-v${{ steps.version.outputs.version }}.zip . -x '.*'

      # ── Firefox build ──
      - run: npm run build:firefox

      - name: Create Firefox archive
        run: |
          cd dist-firefox
          zip -r ../chatgpt-word-copier-firefox-v${{ steps.version.outputs.version }}.zip . -x '.*'

      # ── GitHub Release ──
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            chatgpt-word-copier-v${{ steps.version.outputs.version }}.zip
            chatgpt-word-copier-firefox-v${{ steps.version.outputs.version }}.zip

      - name: Upload Chrome Artifact for Publish
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-zip
          path: chatgpt-word-copier-v*.zip
          retention-days: 1
          
      - name: Upload Firefox Artifact for Publish
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-dir
          path: dist-firefox/
          retention-days: 1

  publish-chrome:
    name: Publish to Chrome Web Store
    runs-on: ubuntu-latest
    needs: github-release
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: chrome-extension-zip

      # ── Auth to Google ──
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/257412020203/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: chrome-deploy@chatgpt-word-copier.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      # ── Upload Chrome package ──
      - name: Upload to Chrome Web Store
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/zip" \
            --data-binary @chatgpt-word-copier-v${{ steps.version.outputs.version }}.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:upload"

      # ── Publish Chrome extension ──
      - name: Publish in Chrome Web Store
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "https://chromewebstore.googleapis.com/v2/publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:publish"

      # ── Optional: check status ──
      - name: Check Chrome Web Store status
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            "https://chromewebstore.googleapis.com/v2/publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:fetchStatus"

  publish-firefox:
    name: Publish to Firefox AMO
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: firefox-extension-dir
          path: dist-firefox/

      # ── Publish Firefox to AMO ──
      - name: Sign and submit to AMO
        run: |
          npx web-ext sign \
            --source-dir=dist-firefox \
            --channel=listed \
            --approval-timeout=0
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
