<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT → Word Copier</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="4" fill="#3B82F6"/>
          <path d="M5 6L8 18L12 12L16 18L19 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>ChatGPT → Word</h1>
      </div>
      <div class="header-tools">
        <div class="lang-inline">
          <label for="languageSelect" id="languageLabel">Language:</label>
          <select id="languageSelect">
            <option id="languageOptionEn" value="en">English</option>
            <option id="languageOptionRu" value="ru">Russian</option>
          </select>
        </div>
        <span class="version">v1.0</span>
      </div>
    </div>

    <div id="status" class="status status-ok">
      <span class="status-dot"></span>
      <span id="statusText">Extension is active</span>
    </div>

    <div class="section">
      <h2 id="actionsTitle">Actions For Last Response</h2>
      <div class="actions">
        <button id="btnCopy" class="btn btn-primary" title="Copy with formulas for Word">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="5" y="1" width="9" height="12" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <rect x="2" y="3" width="9" height="12" rx="1" fill="white" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span id="btnCopyLabel">Copy For Word</span>
        </button>
        <button id="btnDocx" class="btn btn-secondary" title="Download as DOCX file">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 1h8l4 4v10H2V1z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 8v5M6 11l2 2 2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="btnDocxLabel">Download DOCX</span>
        </button>
        <button id="btnPdf" class="btn btn-secondary" title="Download as PDF file">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 1h8l4 4v10H2V1z" stroke="currentColor" stroke-width="1.5"/>
            <text x="4" y="12" font-size="6" fill="currentColor" font-weight="bold">PDF</text>
          </svg>
          <span id="btnPdfLabel">Download PDF</span>
        </button>
      </div>
    </div>

    <div class="section">
      <h2 id="settingsTitle">Settings</h2>
      <div class="setting">
        <label for="mathMode" id="mathModeLabel">Formula format in DOCX:</label>
        <select id="mathMode">
          <option id="mathModeOmml" value="omml" selected>OMML (editable)</option>
          <option id="mathModeImage" value="image">Images (compatibility)</option>
        </select>
      </div>
      <div class="setting">
        <label>
          <input type="checkbox" id="showButtons" checked />
          <span id="showButtonsLabel">Show buttons on ChatGPT page</span>
        </label>
      </div>
      <div class="setting">
        <label for="gptButtonsLimit" id="gptButtonsLimitLabel">Show buttons for last GPT messages (0 = all):</label>
        <input type="number" id="gptButtonsLimit" min="0" max="200" step="1" value="0" />
      </div>
      <div class="setting">
        <label>
          <input type="checkbox" id="darkThemeDocx" />
          <span id="darkThemeDocxLabel">Dark theme in DOCX</span>
        </label>
      </div>
    </div>

    <div class="section">
      <h2 id="savedPromptsTitle">Saved Prompts</h2>
      <div class="prompt-input-group">
        <input type="text" id="promptInput" class="prompt-input" placeholder="Type a prompt and save it" />
        <button id="btnSavePrompt" class="btn btn-secondary" title="Save prompt">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M2 1h8l4 4v10H2V1z" stroke="currentColor" stroke-width="1.5"/>
            <line x1="8" y1="5" x2="8" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="5" y1="8" x2="11" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div id="promptsList" class="prompts-list"></div>
    </div>

    <div class="section">
      <h2 id="tipTitle">Tip</h2>
      <p id="tipText" class="tip">On the ChatGPT page, action buttons appear when you hover a response. You can also select part of a response and copy only the selected text.</p>
    </div>

    <div id="notification" class="notification hidden"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
